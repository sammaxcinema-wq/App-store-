        name: 'Meon Directory',

        ],
        scope: '/'

      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);

      const linkEl = document.createElement('link');
      linkEl.rel = 'manifest';
      linkEl.href = manifestUrl;

      window._pwaManifestUrl = manifestUrl;

    // ============================================================

    (function registerServiceWorker() {

      }

      const CACHE_NAME = 'meon-directory-v4';
      const urlsToCache = [

        'https://i.ibb.co/vvBFj1MW/63c08e3fb6ae3a25f24a4016bd106725.jpg'
      ];

          const CACHE_NAME = '${CACHE_NAME}';
          const urlsToCache = ${JSON.stringify(urlsToCache)};

          self.addEventListener('install', (event) => {
            console.log('[SW] Installing...');
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => {
                console.log('[SW] Caching app shell');
                return cache.addAll(urlsToCache).catch((err) => {
                  console.warn('[SW] Some assets failed to cache:', err);

              })

            event.waitUntil(

                    if (cache !== CACHE_NAME) {
                      console.log('[SW] Deleting old cache:', cache);
                      return caches.delete(cache);
                    }
                  })
                );
              }).then(() => {
                return self.clients.claim();
              })
            );
          });

          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;
            if (event.request.url.startsWith('chrome-extension://')) return;

            event.respondWith(
              fetch(event.request)
                .then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    const responseClone = networkResponse.clone();
                    caches.open(CACHE_NAME).then((cache) => {
                      try {
                        cache.put(event.request, responseClone);
                      } catch (e) {}
                    });
                  }
                  return networkResponse;
                })
                .catch(() => {
                  return caches.match(event.request).then((cachedResponse) => {
                    if (cachedResponse) return cachedResponse;
                    if (event.request.mode === 'navigate') {
                      return caches.match(urlsToCache[0]);
                    }
                    return new Response('Offline – resource not cached', {
                      status: 503,
                      statusText: 'Service Unavailable'
                    });
                  });
                })
            );
          });

            event.notification.close();
            event.waitUntil(

            );
          });

    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();

      const dismissTime = localStorage.getItem('meonPwaBannerDismissTime');
      if (dismissTime) {
        const hoursSince = (Date.now() - parseInt(dismissTime)) / (1000 * 60 * 60);
        if (hoursSince < 48) {
          pwaBannerDismissed = true;
        } else {
          localStorage.removeItem('meonPwaBannerDismissTime');
          pwaBannerDismissed = false;
        }
      }

      if (!pwaBannerDismissed) {
        setTimeout(() => {
          document.getElementById('pwaInstallBanner')?.classList.add('show');
        }, 1500);
      }

      document.getElementById('headerInstallBtn')?.classList.remove('hidden');

      console.log('[PWA] App installed successfully!');
      deferredPrompt = null;
      document.getElementById('pwaInstallBanner')?.classList.remove('show');
      document.getElementById('headerInstallBtn')?.classList.add('hidden');
      showToast('🎉 Meon installed! Launch from your home screen.', 'success');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const installBannerBtn = document.getElementById('pwaInstallBtn');
      const dismissBannerBtn = document.getElementById('pwaDismissBtn');
      const headerInstallBtn = document.getElementById('headerInstallBtn');

      function triggerInstall() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('[PWA] User accepted install');
            } else {
              console.log('[PWA] User dismissed install');
            }
            deferredPrompt = null;
            document.getElementById('pwaInstallBanner')?.classList.remove('show');
            if (headerInstallBtn) headerInstallBtn.classList.add('hidden');
          });
        } else {
          showToast('Install option not available right now. Try refreshing.', 'info');
        }
      }

      if (installBannerBtn) {
        installBannerBtn.addEventListener('click', triggerInstall);
      }

      if (dismissBannerBtn) {
        dismissBannerBtn.addEventListener('click', () => {
          document.getElementById('pwaInstallBanner')?.classList.remove('show');
          pwaBannerDismissed = true;
          localStorage.setItem('meonPwaBannerDismissTime', Date.now().toString());
          if (headerInstallBtn && deferredPrompt) {
            headerInstallBtn.classList.remove('hidden');
          }
          showToast('You can install later from the header 📲', 'info');
        });
      }

      if (headerInstallBtn) {
        headerInstallBtn.addEventListener('click', triggerInstall);
      }
    });

    class MpesaClient {
      constructor() {
        this.accessToken = null;
        this.tokenExpiry = null;
      }

      async getAccessToken() {
        if (this.accessToken && this.tokenExpiry > Date.now()) {
          return this.accessToken;
        }

        try {
          const response = await fetch(
            `${CONFIG.MPESA.BASE_URL}/oauth/v1/generate?grant_type=client_credentials`,
            {
              method: 'GET',
              headers: {
                'Authorization': `Basic ${btoa(`${CONFIG.MPESA.CONSUMER_KEY}:${CONFIG.MPESA.CONSUMER_SECRET}`)}`,
              }
            }
          );

          const data = await response.json();
          
          if (data.access_token) {
            this.accessToken = data.access_token;
            this.tokenExpiry = Date.now() + (data.expires_in || 3600) * 1000 - 60000;
            return this.accessToken;
          } else {
            throw new Error('Failed to get access token');
          }
        } catch (error) {
          console.error('M-Pesa Token Error:', error);
          throw error;
        }
      }

      async stkPush(phoneNumber, amount, accountReference = CONFIG.MPESA.ACCOUNT_REFERENCE) {
        const token = await this.getAccessToken();
        const timestamp = this.getTimestamp();
        const password = this.generatePassword(timestamp);

        const payload = {
          BusinessShortCode: CONFIG.MPESA.SHORTCODE,
          Password: password,
          Timestamp: timestamp,
          TransactionType: 'CustomerPayBillOnline',
          Amount: amount,
          PartyA: phoneNumber,
          PartyB: CONFIG.MPESA.SHORTCODE,
          PhoneNumber: phoneNumber,
          CallBackURL: CONFIG.MPESA.CALLBACK_URL,
          AccountReference: accountReference,
          TransactionDesc: CONFIG.MPESA.TRANSACTION_DESC,
        };

        try {
          const response = await fetch(
            `${CONFIG.MPESA.BASE_URL}/mpesa/stkpush/v1/processrequest`,
            {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            }
          );

          const data = await response.json();
          return data;
        } catch (error) {
          console.error('STK Push Error:', error);
          throw error;
        }
      }

      async queryStkStatus(checkoutRequestId) {
        const token = await this.getAccessToken();
        const timestamp = this.getTimestamp();
        const password = this.generatePassword(timestamp);

        const payload = {
          BusinessShortCode: CONFIG.MPESA.SHORTCODE,
          Password: password,
          Timestamp: timestamp,
          CheckoutRequestID: checkoutRequestId,
        };

        try {
          const response = await fetch(
            `${CONFIG.MPESA.BASE_URL}/mpesa/stkpushquery/v1/query`,
            {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            }
          );

          const data = await response.json();
          return data;
        } catch (error) {
          console.error('STK Query Error:', error);
          throw error;
        }
      }

      getTimestamp() {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}${month}${day}${hours}${minutes}${seconds}`;
      }

      generatePassword(timestamp) {
        const str = `${CONFIG.MPESA.SHORTCODE}${CONFIG.MPESA.PASSKEY}${timestamp}`;
        return btoa(str);
      }

      formatPhoneNumber(phone) {
        let cleaned = phone.replace(/[^0-9]/g, '');
        if (cleaned.startsWith('0')) {
          cleaned = '254' + cleaned.substring(1);
        } else if (cleaned.startsWith('7')) {
          cleaned = '254' + cleaned;
        } else if (!cleaned.startsWith('254')) {
          cleaned = '254' + cleaned;
        }
        return cleaned;
      }
    }

    class MpesaSubscriptionHandler {
      constructor() {
        this.mpesa = new MpesaClient();
      }

      async initiatePayment(appId, tierKey, phoneNumber) {
        const app = appList.find(a => a.id === appId);
        if (!app) {
          throw new Error('App not found');
        }

        const tier = DEFAULT_TIERS[tierKey];
        if (!tier) {
          throw new Error('Invalid tier');
        }

        const custom = customPricing[appId] || {};
        const amount = this.extractAmount(custom[`${tierKey.toLowerCase()}Price`] || tier.price);
        const trialDays = custom[`${tierKey.toLowerCase()}TrialDays`] || tier.trialDays;

        if (!amount || amount <= 0) {
          throw new Error('Invalid amount');
        }

        const formattedPhone = this.mpesa.formatPhoneNumber(phoneNumber);
        const accountReference = `MEON-${appId.substring(0, 8)}-${Date.now().toString().slice(-6)}`;

        try {
          const response = await this.mpesa.stkPush(
            formattedPhone,
            amount,
            accountReference
          );

          const transaction = {
            id: response.CheckoutRequestID,
            appId,
            tier: tierKey,
            phoneNumber: formattedPhone,
            amount,
            accountReference,
            status: 'pending',
            createdAt: new Date().toISOString(),
            trialDays,
          };

          mpesaTransactions[response.CheckoutRequestID] = transaction;
          saveState();

          this.pollTransactionStatus(response.CheckoutRequestID);

          return {
            ...response,
            transaction,
          };
        } catch (error) {
          console.error('Payment initiation error:', error);
          throw error;
        }
      }

      async pollTransactionStatus(checkoutRequestId, maxAttempts = 15, interval = 3000) {
        let attempts = 0;

        const poll = async () => {
          if (attempts >= maxAttempts) {
            console.log('Max polling attempts reached for:', checkoutRequestId);
            const transaction = mpesaTransactions[checkoutRequestId];
            if (transaction && transaction.status === 'pending') {
              transaction.status = 'timeout';
              saveState();
              showToast('⏰ Payment timed out. Please try again.', 'error');
            }
            return;
          }

          attempts++;
          await new Promise(resolve => setTimeout(resolve, interval));

          try {
            const status = await this.mpesa.queryStkStatus(checkoutRequestId);
            const transaction = mpesaTransactions[checkoutRequestId];

            if (status.ResultCode === '0') {
              transaction.status = 'completed';
              transaction.completedAt = new Date().toISOString();
              transaction.mpesaReceipt = status.MPesaReceiptNumber;
              saveState();
              
              await this.handleSuccessfulPayment(transaction);
              
              showToast(`✅ Payment successful! Receipt: ${status.MPesaReceiptNumber}`, 'success');
              renderCurrentView();
              return;
            } else if (status.ResultCode === '1032') {
              transaction.status = 'cancelled';
              saveState();
              showToast('❌ Payment cancelled by user', 'error');
              return;
            } else if (status.ResultCode !== '200001') {
              transaction.status = 'failed';
              transaction.error = status.ResultDesc;
              saveState();
              showToast(`❌ Payment failed: ${status.ResultDesc}`, 'error');
              return;
            }

            poll();
          } catch (error) {
            console.error('Polling error:', error);
            poll();
          }
        };

        poll();
      }

      async handleSuccessfulPayment(transaction) {
        const app = appList.find(a => a.id === transaction.appId);
        if (!app) return;

        app.tier = transaction.tier;
        app.trialActive = false;
        app.expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
        app.mpesaReceipt = transaction.mpesaReceipt;

        saveState();

        await sendEmail('subscription_activated', {
          appName: app.name,
          tier: transaction.tier,
          receipt: transaction.mpesaReceipt,
          amount: transaction.amount,
          email: currentUser?.email || 'user@example.com'
        });

        const notifications = JSON.parse(localStorage.getItem('meonNotifications')) || [];
        notifications.push({
          id: Date.now(),
          type: 'payment_success',
          title: `💰 Payment Successful - ${app.name}`,
          message: `Your ${transaction.tier} subscription payment of KES ${transaction.amount} has been confirmed. Receipt: ${transaction.mpesaReceipt}`,
          read: false,
          createdAt: new Date().toISOString(),
        });
        localStorage.setItem('meonNotifications', JSON.stringify(notifications));
      }

      extractAmount(priceString) {
        const match = priceString.match(/(\d+\.?\d*)/);
        return match ? parseFloat(match[0]) : 0;
      }

      getTransactionStatus(checkoutRequestId) {
        return mpesaTransactions[checkoutRequestId] || null;
      }

      getAllTransactions() {
        return Object.values(mpesaTransactions);
      }

      getTransactionsForApp(appId) {
        return Object.values(mpesaTransactions).filter(t => t.appId === appId);
      }
    }

        const email = document.getElementById('loginEmail').value;
        if (email) {
          loginUser(email, 'user');
          document.getElementById('authModal')?.remove();
        } else {
          showToast('Please enter an email address', 'error');

      document.getElementById('demoDevBtn')?.addEventListener('click', () => {
        loginUser('dev@meon.com', 'developer', 'Developer');
        document.getElementById('authModal')?.remove();
      });
      
      document.getElementById('closeModal')?.addEventListener('click', () => {
        document.getElementById('authModal')?.remove();
      });

          shortDesc: document.getElementById('appShortDesc').value,
          category: document.getElementById('appCategory').value,
          externalUrl: document.getElementById('appUrl').value,
          logoUrl: document.getElementById('appLogo').value,
          description: document.getElementById('appDescription').value,
          features: features.length ? features : ['Feature 1', 'Feature 2', 'Feature 3'],
          developer: currentUser.email,
          ownerId: currentUser.id,
          tier: 'FREE',
          trialActive: false,
          rating: 0,
          ratingCount: 0,
          version: '1.0.0',
          screenshots: ['https://via.placeholder.com/400x250/1a1a2e/8b5cf6?text=' + document.getElementById('appName')
            .value],
          pricing: {
            freePrice: document.getElementById('submitFreePrice').value,
            standardPrice: document.getElementById('submitStandardPrice').value,
            featuredPrice: document.getElementById('submitFeaturedPrice').value,
            standardTrialDays: parseInt(document.getElementById('submitStandardTrial').value) || 14,
            featuredTrialDays: parseInt(document.getElementById('submitFeaturedTrial').value) || 7,
          }
        };
        
        appList.push(appData);
        customPricing[appData.id] = appData.pricing;
        saveState();
        
        showToast('✅ App submitted successfully!', 'success');
        document.getElementById('submitAppModal')?.remove();
        renderCurrentView();
        
        await sendEmail('app_submitted', {
          appName: appData.name,
          developerEmail: currentUser.email,
          submissionDate: new Date().toLocaleDateString()
        });
      });
    }

    function editAppPricing(appId) {
      const app = appList.find(a => a.id === appId);
      if (!app) return;
      
      const pricing = customPricing[appId] || {};
      
      const modalHtml = `
        <div id="pricingModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
          <div class="bg-gray-900 rounded-2xl p-6 w-full max-w-2xl">
            <h2 class="text-2xl font-bold text-white mb-4">💰 Custom Pricing - ${app.name}</h2>
            <form id="pricingForm" class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-1">Free Tier Price</label>
                  <input type="text" id="pricingFree" value="${pricing.freePrice || 'KES 0'}" 
                         class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-1">Standard Tier Price</label>
                  <input type="text" id="pricingStandard" value="${pricing.standardPrice || 'KES 500/mo'}" 
                         class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-1">Featured Tier Price</label>
                  <input type="text" id="pricingFeatured" value="${pricing.featuredPrice || 'KES 1,500/mo'}" 
                         class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-1">Standard Trial Days</label>
                  <input type="number" id="pricingStandardTrial" value="${pricing.standardTrialDays || 14}" 
                         class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-1">Featured Trial Days</label>
                  <input type="number" id="pricingFeaturedTrial" value="${pricing.featuredTrialDays || 7}" 
                         class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
              </div>
              <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition font-semibold">
                  Save Pricing
                </button>
                <button type="button" onclick="document.getElementById('pricingModal')?.remove()" 
                        class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg transition">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      
      document.getElementById('pricingForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const pricingData = {
          freePrice: document.getElementById('pricingFree').value,
          standardPrice: document.getElementById('pricingStandard').value,
          featuredPrice: document.getElementById('pricingFeatured').value,
          standardTrialDays: parseInt(document.getElementById('pricingStandardTrial').value) || 0,
          featuredTrialDays: parseInt(document.getElementById('pricingFeaturedTrial').value) || 0,
        };
        
        customPricing[appId] = pricingData;
        saveState();
        showToast('✅ Pricing updated successfully!', 'success');
        document.getElementById('pricingModal')?.remove();
        renderCurrentView();
      });
    }

    function manageSubscription(appId) {
      showToast('📋 Subscription management portal coming soon!', 'info');
    }

    function viewAppAnalytics(appId) {
      const app = appList.find(a => a.id === appId);
      if (!app) return;
      
      const modalHtml = `
        <div id="analyticsModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
          <div class="bg-gray-900 rounded-2xl p-6 w-full max-w-2xl">
            <h2 class="text-2xl font-bold text-white mb-4">📊 ${app.name} - Analytics</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div class="bg-white/5 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-purple-400">${Math.floor(Math.random() * 5000) + 500}</div>
                <div class="text-xs text-gray-400">Total Views</div>
              </div>
              <div class="bg-white/5 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-green-400">${Math.floor(Math.random() * 500) + 50}</div>
                <div class="text-xs text-gray-400">Launches</div>
              </div>
              <div class="bg-white/5 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-yellow-400">${app.rating || 0}</div>
                <div class="text-xs text-gray-400">Avg Rating</div>
              </div>
              <div class="bg-white/5 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-blue-400">${app.ratingCount || 0}</div>
                <div class="text-xs text-gray-400">Reviews</div>
              </div>
            </div>
            <div class="bg-white/5 rounded-lg p-4 mb-4">
              <h3 class="font-bold text-white mb-2">📈 Growth</h3>
              <div class="h-32 flex items-end justify-between gap-2">
                ${Array.from({length: 7}, (_, i) => {
                  const height = Math.floor(Math.random() * 80) + 20;
                  const day = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i];
                  return `
                    <div class="flex-1 flex flex-col items-center gap-1">
                      <div class="w-full bg-purple-500/30 rounded-t" style="height: ${height}px;"></div>
                      <span class="text-xs text-gray-400">${day}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <button onclick="document.getElementById('analyticsModal')?.remove()" 
                    class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg transition">
              Close
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    // ============================================================
    // M-PESA ADMIN FUNCTIONS
    // ============================================================
    
    async function registerC2BUrls() {
      try {
        const client = new MpesaClient();
        const result = await client.registerC2BUrls();
        showToast('✅ C2B URLs registered successfully', 'success');
        console.log('C2B Registration:', result);
      } catch (error) {
        showToast(`❌ Failed to register URLs: ${error.message}`, 'error');
      }
    }

    async function checkBalance() {
      try {
        const client = new MpesaClient();
        const result = await client.queryBalance();
        showToast('✅ Balance query sent. Check callback URL for result.', 'info');
        console.log('Balance Query:', result);
      } catch (error) {
        showToast(`❌ Failed to query balance: ${error.message}`, 'error');
      }
    }

    // ============================================================
    // MAIN RENDER FUNCTION
    // ============================================================
    
    function renderCurrentView() {
      const container = document.getElementById("mainContent");
      if (!container) return;
      
      if (selectedApp) {
        container.innerHTML = renderAppDetail();
      } else if (activeView === "home") {
        container.innerHTML = renderHome();
        setTimeout(() => {
          const searchInput = document.getElementById("globalSearchInput");
          if (searchInput) {
            searchInput.addEventListener("input", (e) => { 
              searchQuery = e.target.value;
              renderCurrentView();
            });
          }
          document.querySelectorAll(".category-chip").forEach(c => c.addEventListener("click", () => {
            activeCategoryFilter = c.dataset.category;
            renderCurrentView();
          }));
          document.getElementById("clearCategoryBtn")?.addEventListener("click", () => { 
            activeCategoryFilter = "";
            renderCurrentView();
          });
          document.getElementById("exploreMarketplaceBtn")?.addEventListener("click", () => {
            document.querySelector(".grid.sm\\:grid-cols-2")?.scrollIntoView({ behavior: "smooth" });
          });
          document.getElementById("becomeDevBtn")?.addEventListener("click", () => { 
            if (!currentUser) showToast("Please login first", "error");
            else { navigateTo('developer'); }
          });
        }, 50);
      } else if (activeView === "dashboard") {
        container.innerHTML = renderDashboard();
      } else if (activeView === "pricing") {
        container.innerHTML = renderPricingPage();
      } else if (activeView === "att") {
        container.innerHTML = renderATT();
      } else if (activeView === "admin") {
        container.innerHTML = renderAdmin();
      } else if (activeView === "developer") {
        container.innerHTML = renderDeveloper();
      }
      
      if (window.lucide) lucide.createIcons();
      
      if (selectedApp && document.getElementById("reviewStars")) {
        let ratingVal = 0;
        const starDiv = document.getElementById("reviewStars");
        starDiv.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
          let star = document.createElement('i');
          star.setAttribute('data-lucide', 'star');
          star.className = 'w-6 h-6 cursor-pointer rating-star';
          star.onclick = () => { 
            ratingVal = i;
            document.querySelectorAll('#reviewStars i').forEach((s, idx) => {
              s.style.fill = idx < i ? '#facc15' : 'none';
            });
          };
          starDiv.appendChild(star);
        }
        lucide.createIcons();
        document.getElementById("submitReviewBtn")?.addEventListener("click", () => {
          const txt = document.getElementById("reviewText").value;
          if (ratingVal && txt) submitReview(selectedApp.id, ratingVal, txt);
          else showToast("Please provide rating and comment", "error");
        });
      }
    }

    // ============================================================
    // NAVIGATION SETUP
    // ============================================================
    
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const view = btn.getAttribute("data-nav");
        if (view) navigateTo(view);
      });
    });

    function renderNav() {
      const authDiv = document.getElementById("authSection");
      if (!authDiv) return;
      
      if (currentUser) {
        authDiv.innerHTML = `
          <span class="text-sm hidden sm:inline text-gray-700 dark:text-gray-300">👤 ${currentUser.name}</span>
          <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition">Logout</button>
        `;
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
        document.getElementById("adminNavBtn")?.classList.toggle("hidden", currentUser.role !== 'admin' && currentUser.role !== 'super_admin');
        document.getElementById("devNavBtn")?.classList.toggle("hidden", currentUser.role !== 'developer');
      } else {
        authDiv.innerHTML = `
          <button id="showLoginModalBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-lg text-sm transition">Sign In</button>
        `;
        document.getElementById("showLoginModalBtn")?.addEventListener("click", showAuthModal);
        document.getElementById("adminNavBtn")?.classList.add("hidden");
        document.getElementById("devNavBtn")?.classList.add("hidden");
      }
      if (window.lucide) lucide.createIcons();
    }

    // ============================================================
    // THEME TOGGLE
    // ============================================================
    
    const themeToggle = document.getElementById("themeToggle");
    themeToggle?.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem("meonTheme", document.documentElement.classList.contains("dark") ? "dark" : "light");
      if (window.lucide) lucide.createIcons();
    });
    
    if (localStorage.getItem("meonTheme") === "dark") document.documentElement.classList.add("dark");

    // ============================================================
    // GLOBAL EXPOSURES
    // ============================================================
    
    window.showAppDetail = (appId) => {
      selectedApp = appList.find(a => a.id === appId);
      renderCurrentView();
    };
    window.backToHome = () => { 
      selectedApp = null;
      navigateTo('home');
    };
    window.openApp = openApp;
    window.toggleFavorite = toggleFavorite;
    window.handleUpgrade = window.handleUpgrade;
    window.showSubmitAppModal = showSubmitAppModal;
    window.editAppPricing = editAppPricing;
    window.manageSubscription = manageSubscription;
    window.viewAppAnalytics = viewAppAnalytics;
    window.showAuthModal = showAuthModal;
    window.navigateTo = navigateTo;
    window.registerC2BUrls = registerC2BUrls;
    window.checkBalance = checkBalance;

    // ============================================================
    // INITIALIZATION
    // ============================================================
    
    renderNav();
    renderCurrentView();
    updateOnlineStatus();
    
    console.log('🚀 Meon App Directory v4.0');
    console.log('📦 Features:');
    console.log('  ✅ PWA Ready');
    console.log('  ✅ Dark Mode');
    console.log('  ✅ User Authentication');
    console.log('  ✅ Favorites System');
    console.log('  ✅ Reviews & Ratings');
    console.log('  ✅ Subscription Tiers');
    console.log('  ✅ Free Trials');
    console.log('  ✅ Custom Pricing');
    console.log('  ✅ Email Notifications');
    console.log('  ✅ Developer Hub');
    console.log('  ✅ Admin Panel');
    console.log('  ✅ App Analytics');
    console.log('  ✅ Offline Support');
    console.log('  ✅ M-Pesa Integration (STK Push)');
    console.log('  ✅ Transaction Tracking');
    console.log('  ✅ Payment History');
    console.log('💎 Premium tiers: Free, Standard (KES 500/mo), Featured (KES 1,500/mo)');
    console.log('📱 M-Pesa Sandbox: Active');
  </script>
</body>
