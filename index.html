<!DOCTYPE html>

<head>

  <meta name="description" content="Meon App Store – Daraja M-Pesa STK Push for seamless payments">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { font-family: 'Inter', sans-serif; }
    body { transition: background-color 0.3s, color 0.3s; }
    .dark { background-color: #0f172a; color: #e2e8f0; }
    .rating-star { cursor: pointer; transition: transform 0.1s; }
    .rating-star:hover { transform: scale(1.1); }
    .modal-transition { transition: opacity 0.2s ease, visibility 0.2s; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1); }
    .meon-logo-bg {
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
      border-radius: 14px;
      box-shadow: 0 6px 12px -6px rgba(0,0,0,0.3);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .toast { position: fixed; bottom: 20px; right: 20px; z-index: 9999; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    img.app-logo { background: #1e293b; object-fit: cover; }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 20s linear infinite;
    }
    .animate-spin-reverse {
      animation: spin-slow 30s linear infinite reverse;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300">

<div id="app" class="min-h-screen flex flex-col">

      </div>
      <div class="flex items-center gap-3">

<!-- M-Pesa Modal -->
<div id="mpesaModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-transition">

    <h2 class="text-2xl font-bold mb-2">Pay with M-Pesa</h2>
    <p id="mpesaAppName" class="text-gray-600 dark:text-gray-300 mb-4"></p>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Phone Number (e.g., 0712345678)</label>
      <input type="tel" id="mpesaPhone" placeholder="0712345678" class="w-full p-2 border rounded-lg dark:bg-gray-700">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Amount (KES)</label>
      <input type="number" id="mpesaAmount" readonly class="w-full p-2 border rounded-lg bg-gray-100 dark:bg-gray-600">
    </div>
    <div class="flex gap-3">
      <button id="mpesaConfirmBtn" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">Pay Now</button>
      <button id="mpesaCancelBtn" class="flex-1 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-white py-2 rounded-lg">Cancel</button>
    </div>
    <p class="text-xs text-gray-500 mt-3 text-center">STK push will be sent to your phone. Enter M-Pesa PIN to complete.</p>

</div>

  function saveState() {
    if (currentUser) localStorage.setItem("meonUser", JSON.stringify(currentUser));

    localStorage.setItem("meonFavorites", JSON.stringify(userFavorites));
    localStorage.setItem("meonDownloads", JSON.stringify(userDownloads));
    localStorage.setItem("meonReviews", JSON.stringify(reviewsData));

  function showToast(msg, type = "success") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = `toast bg-white dark:bg-gray-800 shadow-lg rounded-xl px-4 py-3 border-l-4 ${type === "success" ? "border-green-500" : type === "error" ? "border-red-500" : "border-blue-500"} flex items-center gap-2`;
    toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i><span>${msg}</span>`;
    container.appendChild(toast);
    if (window.lucide) lucide.createIcons();
    setTimeout(() => toast.remove(), 4000);
  }

  function loginUser(email, role = "user") {
    currentUser = { id: Date.now(), email, name: email.split('@')[0], role: role };
    saveState();
    renderNav();
    renderCurrentView();
    showToast(`Welcome to Meon, ${currentUser.name}!`, "success");
  }
  function logout() { currentUser = null; userFavorites = []; userDownloads = []; saveState(); renderNav(); renderCurrentView(); showToast("Logged out", "success"); }
  
  function toggleFavorite(appId) {
    if (!currentUser) { showToast("Sign in to save favorites", "error"); return false; }
    const idx = userFavorites.indexOf(appId);
    if (idx === -1) { userFavorites.push(appId); showToast("Added to favorites", "success"); }
    else { userFavorites.splice(idx,1); showToast("Removed from favorites", "success"); }
    saveState(); renderCurrentView(); return true;
  }
  
  // Unified download handler: external web app or paid M-Pesa
  function downloadApp(app) {
    if (!currentUser) { showToast("Please login to download", "error"); return; }
    // If the app has an externalUrl (web app), open in new tab and record download
    if (app.externalUrl) {
      window.open(app.externalUrl, '_blank');
      if (!userDownloads.find(d => d.appId === app.id)) {
        userDownloads.push({ appId: app.id, downloadedAt: new Date().toISOString(), version: app.version });
        app.downloads += 1;
        saveState();
        showToast(`✨ ${app.name} opened in new tab. Enjoy!`, "success");
        renderCurrentView();
      } else {
        showToast(`Opening ${app.name}...`, "info");
        window.open(app.externalUrl, '_blank');
      }
      return;
    }
    // Paid apps without externalUrl go through M-Pesa flow
    if (!app.isFree) {
      showMpesaPaymentModal(app);
      return;
    }
    // Free native apps (no externalUrl) – just simulate download
    if (!userDownloads.find(d => d.appId === app.id)) {
      userDownloads.push({ appId: app.id, downloadedAt: new Date().toISOString(), version: app.version });
      app.downloads += 1;
      saveState();
      showToast(`Downloaded ${app.name}`, "success");
      renderCurrentView();
    } else { showToast("Already installed", "info"); }
  }
  
  function submitReview(appId, rating, content) {
    if (!currentUser) { showToast("Login to review", "error"); return false; }
    if (!reviewsData[appId]) reviewsData[appId] = [];
    reviewsData[appId].push({ userId: currentUser.id, user: currentUser.name, rating, content, date: new Date().toISOString() });
    const allRatings = reviewsData[appId].map(r => r.rating);
    const avg = allRatings.reduce((a,b)=>a+b,0)/allRatings.length;
    const appObj = appList.find(a=>a.id === appId);
    if(appObj) { appObj.rating = parseFloat(avg.toFixed(1)); appObj.ratingCount = allRatings.length; }
    saveState();
    showToast("Review submitted", "success");
    renderCurrentView();
    return true;
  }

    if (!currentUser) { showToast("Please login to make a purchase", "error"); return; }
    currentPaymentApp = app;
    document.getElementById("mpesaAppName").innerText = `App: ${app.name} - KES ${app.price}`;
    document.getElementById("mpesaAmount").value = app.price;
    document.getElementById("mpesaPhone").value = "";
    document.getElementById("mpesaModal").classList.remove("hidden");
  }

  async function confirmMpesaPayment() {
    const phone = document.getElementById("mpesaPhone").value.trim();
    if (!phone) { showToast("Enter your M-Pesa phone number", "error"); return; }
    if (!currentPaymentApp) return;
    const amount = currentPaymentApp.price;
    const accountReference = `MEON_${currentPaymentApp.id}_${Date.now()}`;
    document.getElementById("mpesaModal").classList.add("hidden");
    const success = await initiateMpesaPayment(phone, amount, accountReference, currentPaymentApp.name);
    if (success) {
      if (!userDownloads.find(d => d.appId === currentPaymentApp.id)) {
        userDownloads.push({ appId: currentPaymentApp.id, downloadedAt: new Date().toISOString(), version: currentPaymentApp.version });
        currentPaymentApp.downloads += 1;
        saveState();
        showToast(`✅ ${currentPaymentApp.name} added to your library`, "success");
        renderCurrentView();
      }
    }
    currentPaymentApp = null;
  }

  // ---------- UI RENDERING (simplified but fully functional) ----------
  function getFilteredApps() {
    let filtered = [...appList];
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(app => app.name.toLowerCase().includes(q) || app.shortDesc.toLowerCase().includes(q) || app.category.toLowerCase().includes(q));
    }
    if (activeCategoryFilter) {
      filtered = filtered.filter(app => app.category.toLowerCase() === activeCategoryFilter.toLowerCase());
    }
    return filtered;
  }

  function appCard(app) {
    const isFav = currentUser && userFavorites.includes(app.id);
    const buttonText = app.isFree ? (app.externalUrl ? 'Open App' : 'Free') : `Buy KES ${app.price}`;
    return `<div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-4 card-hover cursor-pointer" onclick="window.showAppDetail('${app.id}')">
      <div class="flex gap-3">
        ${appLogoImg(app, "w-16 h-16", 60)}
        <div class="flex-1"><h3 class="font-bold">${app.name}</h3><p class="text-sm text-gray-500">${app.shortDesc}</p><div class="flex items-center gap-1 mt-1"><i data-lucide="star" class="w-4 h-4 fill-yellow-400 text-yellow-400"></i><span>${app.rating}</span><span class="text-xs text-gray-400 ml-1">(${app.ratingCount})</span></div></div>
        <button class="text-red-500" onclick="event.stopPropagation(); toggleFavorite('${app.id}')"><i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-red-500' : ''}"></i></button>
      </div>
      <div class="mt-3 flex justify-between items-center"><span class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-full">${app.category}</span><button onclick="event.stopPropagation(); downloadApp(${JSON.stringify(app).replace(/"/g, '&quot;')})" class="bg-purple-600 text-white px-4 py-1 rounded-lg text-sm">${buttonText}</button></div>
    </div>`;
  }

  window.showAppDetail = (appId) => {
    selectedApp = appList.find(a=>a.id === appId);
    renderCurrentView();
  };
  window.backToHome = () => { selectedApp = null; renderCurrentView(); };

  function renderAppDetail() {
    if (!selectedApp) return renderHome();
    const app = selectedApp;
    const appReviews = reviewsData[app.id] || [];
    const screenshotHtml = app.screenshots.map(url => `<img src="${url}" class="rounded-xl border border-gray-200 dark:border-gray-700 w-64 h-40 object-cover" alt="screenshot">`).join('');
    const downloadBtnText = app.externalUrl ? "Open App (Web)" : (app.isFree ? "Download" : `Buy with M-Pesa (KES ${app.price})`);
    return `<div class="max-w-4xl mx-auto"><button onclick="window.backToHome()" class="flex items-center gap-1 text-purple-600 mb-4">&larr; Back to Store</button>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
        <div class="flex gap-5 flex-wrap">${appLogoImg(app, "w-24 h-24", 100)}<div><h1 class="text-3xl font-bold">${app.name}</h1><p class="text-gray-500">${app.shortDesc}</p><div class="flex gap-3 mt-2"><div class="flex"><i data-lucide="star" class="fill-yellow-400"></i> ${app.rating} (${app.ratingCount})</div><div><i data-lucide="download"></i> ${app.downloads.toLocaleString()}</div></div><div class="flex gap-3 mt-4"><button onclick="downloadApp(${JSON.stringify(app).replace(/"/g, '&quot;')})" class="bg-purple-600 text-white px-6 py-2 rounded-full">${downloadBtnText}</button><button onclick="toggleFavorite('${app.id}')" class="border px-4 py-2 rounded-full">❤️ Favorite</button></div></div></div>
        <div class="mt-6"><h2 class="text-xl font-semibold">Description</h2><p>${app.description}</p><h3 class="font-semibold mt-4">Key Features</h3><ul class="list-disc pl-5">${app.features.map(f=>`<li>${f}</li>`).join('')}</ul></div>
        <div class="mt-6"><h2 class="text-xl font-semibold">Screenshots</h2><div class="flex gap-3 overflow-x-auto pb-2">${screenshotHtml}</div></div>
        <div class="mt-8"><h2 class="text-xl font-semibold">Rate & Review</h2><div id="reviewStars" class="flex gap-1 my-2"></div><textarea id="reviewText" class="w-full border rounded p-2 dark:bg-gray-700" rows="2" placeholder="Write your review..."></textarea><button id="submitReviewBtn" class="mt-2 bg-purple-600 text-white px-4 py-1 rounded">Submit Review</button>
        <div class="mt-6 space-y-3">${appReviews.map(r => `<div class="border-b pb-2"><div class="font-semibold">${r.user}</div><div class="flex text-yellow-400">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p>${r.content}</p><small>${new Date(r.date).toLocaleDateString()}</small></div>`).join('')}</div></div>
      </div></div>`;
  }

  function renderDashboard() {
    if(!currentUser) return `<div class="text-center py-12">Sign in to access your Meon dashboard</div>`;
    const downloadedApps = appList.filter(a => userDownloads.some(d => d.appId === a.id));
    const favApps = appList.filter(a => userFavorites.includes(a.id));
    return `<div><h1 class="text-2xl font-bold">My Meon Workspace</h1><div class="grid md:grid-cols-2 gap-6 mt-6"><div class="bg-white dark:bg-gray-800 p-4 rounded-xl"><h2 class="font-bold">📦 Installed / Opened (${downloadedApps.length})</h2>${downloadedApps.map(a=>`<div class="flex gap-2 items-center mt-2">${appLogoImg(a, "w-10 h-10", 40)}<span>${a.name}</span></div>`).join('')||"No activity yet"}</div><div class="bg-white dark:bg-gray-800 p-4 rounded-xl"><h2 class="font-bold">❤️ Favorites (${favApps.length})</h2>${favApps.map(a=>`<div class="flex gap-2 mt-2">${appLogoImg(a, "w-10 h-10", 40)}<span>${a.name}</span></div>`).join('')}</div></div></div>`;
  }
  
  function renderAdmin() {
    if(!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'super_admin')) return `<div class="text-center py-12">Restricted to Meon Admin</div>`;
    const totalDownloads = appList.reduce((s,a)=>s+a.downloads,0);
    return `<div><h1 class="text-2xl font-bold">Meon Admin Console</h1><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6"><div class="bg-white dark:bg-gray-800 p-4 rounded-xl"><i data-lucide="users"></i><div class="text-2xl font-bold">1,240</div><div>Active Users</div></div><div class="bg-white dark:bg-gray-800 p-4 rounded-xl"><i data-lucide="download"></i><div class="text-2xl font-bold">${totalDownloads.toLocaleString()}</div><div>Total Downloads</div></div><div class="bg-white dark:bg-gray-800 p-4 rounded-xl"><i data-lucide="dollar-sign"></i><div class="text-2xl font-bold">$18,240</div><div>Revenue (Meon)</div></div></div><div class="mt-8"><h2 class="font-bold">App Portfolio Management</h2><div class="grid gap-2">${appList.map(a=>`<div class="flex justify-between items-center bg-white dark:bg-gray-800 p-2 rounded"><div>${a.name}</div><button class="text-sm bg-purple-600 text-white px-2 py-1 rounded" onclick="alert('Meon Admin: Edit ${a.name} (demo)')">Manage</button></div>`).join('')}</div></div></div>`;
  }
  
  function renderDeveloper() {
    if(!currentUser || currentUser.role !== 'developer') return `<div class="text-center py-12">Developer portal - Meon Partners only</div>`;
    return `<div><h1 class="text-2xl font-bold">Meon Developer Hub</h1><p>Monitor your web app integrations</p><div class="bg-white dark:bg-gray-800 p-4 rounded-xl mt-4"><h3 class="font-semibold">Your Apps Performance</h3><div class="space-y-2 mt-2">${appList.slice(0,5).map(a=>`<div>${a.name} - Opens: ${a.downloads} | Rating: ${a.rating}</div>`).join('')}</div><button class="mt-4 bg-green-600 text-white px-4 py-2 rounded">+ Submit New App Version</button></div></div>`;
  }

  // Hero + Home rendering (shortened for brevity, but includes all categories)
  function renderHome() {
    const filteredApps = getFilteredApps();
    const featuredIds = ["spark-connect", "guard-ai", "deep-focus", "luminor-studio", "maji-gas"];
    const featured = filteredApps.filter(a => featuredIds.includes(a.id));
    const trending = [...filteredApps].sort((a,b)=>b.downloads - a.downloads).slice(0,6);
    const newReleases = [...filteredApps].reverse().slice(0,6);
    const categoryItems = [
      { name: "Social", gradient: "from-pink-600 to-rose-600", filter: "social" },
      { name: "AI Tools", gradient: "from-purple-600 to-violet-600", filter: "ai tools" },
      { name: "Business", gradient: "from-blue-600 to-cyan-600", filter: "business" },
      { name: "Education", gradient: "from-green-600 to-emerald-600", filter: "education" },
      { name: "Agriculture", gradient: "from-orange-600 to-amber-600", filter: "agriculture" },
      { name: "Transport", gradient: "from-red-600 to-pink-600", filter: "transport" },
      { name: "Design", gradient: "from-indigo-600 to-purple-600", filter: "design" },
      { name: "Utilities", gradient: "from-teal-600 to-cyan-600", filter: "utilities" }
    ];
    const heroHtml = `<div class="relative w-full max-w-6xl mx-auto overflow-hidden bg-gradient-to-br from-[#020024] via-[#050537] to-[#0a005c] p-6 md:p-8 rounded-3xl border border-purple-900/40 text-white shadow-xl mb-8"><div class="flex flex-col md:flex-row justify-between items-center gap-6"><div><h1 class="text-4xl md:text-5xl font-extrabold">Meon Marketplace</h1><p class="text-purple-200 mt-2">Live web apps · AI solutions · Instant access</p><div class="flex gap-4 mt-4"><button id="exploreMarketplaceBtn" class="bg-purple-600 px-5 py-2 rounded-full text-sm font-semibold hover:bg-purple-500">Explore Apps →</button><button id="becomeDevBtn" class="border border-purple-400 px-5 py-2 rounded-full text-sm">Become a Developer</button></div></div><div class="bg-white/10 backdrop-blur rounded-2xl p-4 text-center"><div class="text-3xl font-bold">16+</div><div class="text-xs">Integrated Apps</div></div></div></div>`;
    return `${heroHtml}<div class="space-y-10"><div class="bg-white/10 dark:bg-gray-800/50 rounded-2xl p-4 flex items-center gap-3"><i data-lucide="search"></i><input type="text" id="globalSearchInput" placeholder="Search apps..." class="w-full bg-transparent outline-none" value="${searchQuery.replace(/"/g, '&quot;')}"></div><div><h2 class="text-2xl font-bold mb-4">Categories</h2><div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">${categoryItems.map(cat => `<div class="rounded-xl bg-gradient-to-r ${cat.gradient} text-white p-3 text-center text-sm font-semibold cursor-pointer hover:scale-105 transition category-chip" data-category="${cat.filter}">${cat.name}</div>`).join('')}${activeCategoryFilter ? `<div class="rounded-xl bg-gray-500 text-white p-3 text-center cursor-pointer" id="clearCategoryBtn">Clear ✕</div>` : ""}</div></div><div><h2 class="text-2xl font-bold mb-4">⭐ Featured</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${featured.map(app=>appCard(app)).join('')}</div></div><div><h2 class="text-2xl font-bold mb-4">🔥 Trending</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${trending.map(app=>appCard(app)).join('')}</div></div><div><h2 class="text-2xl font-bold mb-4">🆕 New Releases</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${newReleases.map(app=>appCard(app)).join('')}</div></div></div>`;
  }

  function renderCurrentView() {
    const container = document.getElementById("mainContent");
    if (!container) return;
    if(selectedApp) container.innerHTML = renderAppDetail();
    else if(activeView === "home") { container.innerHTML = renderHome(); setTimeout(() => { document.getElementById("globalSearchInput")?.addEventListener("input", (e) => { searchQuery = e.target.value; renderCurrentView(); }); document.querySelectorAll(".category-chip").forEach(c => c.addEventListener("click", () => { activeCategoryFilter = c.dataset.category; renderCurrentView(); })); document.getElementById("clearCategoryBtn")?.addEventListener("click", () => { activeCategoryFilter = ""; renderCurrentView(); }); document.getElementById("exploreMarketplaceBtn")?.addEventListener("click", () => document.querySelector(".grid.sm\\:grid-cols-2")?.scrollIntoView({ behavior: "smooth" })); document.getElementById("becomeDevBtn")?.addEventListener("click", () => { if (!currentUser) showToast("Please login first", "error"); else { activeView = "developer"; renderCurrentView(); } }); }, 50); }
    else if(activeView === "dashboard") container.innerHTML = renderDashboard();
    else if(activeView === "admin") container.innerHTML = renderAdmin();
    else if(activeView === "developer") container.innerHTML = renderDeveloper();
    if (window.lucide) lucide.createIcons();
    if(selectedApp && document.getElementById("reviewStars")) {
      let ratingVal = 0;
      const starDiv = document.getElementById("reviewStars");
      starDiv.innerHTML = '';
      for(let i=1;i<=5;i++){ let star=document.createElement('i'); star.setAttribute('data-lucide','star'); star.className='w-6 h-6 cursor-pointer rating-star'; star.onclick=()=>{ratingVal=i; document.querySelectorAll('#reviewStars i').forEach((s,idx)=>s.style.fill= idx<i ? '#facc15' : 'none');}; starDiv.appendChild(star);}
      lucide.createIcons();
      document.getElementById("submitReviewBtn")?.addEventListener("click",()=>{ const txt=document.getElementById("reviewText").value; if(ratingVal && txt) submitReview(selectedApp.id, ratingVal, txt); else showToast("Please provide rating and comment", "error");});
    }
  }
  
  // Navigation & theme init
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const view = btn.getAttribute("data-nav");
      if(view) { activeView = view; selectedApp = null; renderCurrentView(); }
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("border-purple-600","text-purple-600"));
      btn.classList.add("border-purple-600","text-purple-600");
    });
  });
  function renderNav() {
    const authDiv = document.getElementById("authSection");
    if (!authDiv) return;
    if (currentUser) {
      authDiv.innerHTML = `<span class="text-sm hidden sm:inline">${currentUser.email}</span><button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm">Logout</button>`;
      document.getElementById("logoutBtn")?.addEventListener("click", logout);
      document.getElementById("adminNavBtn")?.classList.toggle("hidden", currentUser.role !== 'admin' && currentUser.role !== 'super_admin');
      document.getElementById("devNavBtn")?.classList.toggle("hidden", currentUser.role !== 'developer');
    } else {
      authDiv.innerHTML = `<button id="showLoginModalBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-lg text-sm">Sign In</button>`;
      document.getElementById("showLoginModalBtn")?.addEventListener("click", () => showAuthModal());
      document.getElementById("adminNavBtn")?.classList.add("hidden");
      document.getElementById("devNavBtn")?.classList.add("hidden");
    }
    lucide.createIcons();
  }
  function showAuthModal() {
    const modalHtml = `<div id="authModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"><div class="bg-white dark:bg-gray-800 rounded-2xl p-6 w-full max-w-md"><h2 class="text-2xl font-bold mb-4">Meon Account</h2><input type="email" id="loginEmail" placeholder="Email" class="w-full p-2 border rounded-lg dark:bg-gray-700 mb-3"><input type="password" id="loginPassword" placeholder="Password (any)" class="w-full p-2 border rounded-lg dark:bg-gray-700 mb-4"><div class="flex gap-2 mb-3"><button id="loginEmailBtn" class="flex-1 bg-purple-600 text-white py-2 rounded-lg">Login</button><button id="registerBtn" class="flex-1 bg-green-600 text-white py-2 rounded-lg">Sign Up</button></div><button id="demoAdminBtn" class="w-full bg-purple-100 dark:bg-purple-900 py-2 rounded-lg mb-2">Demo Admin Access</button><button id="demoDevBtn" class="w-full bg-amber-100 dark:bg-amber-900 py-2 rounded-lg">Demo Developer Access</button><button id="closeModal" class="w-full mt-3 text-gray-500">Cancel</button></div></div>`;
    document.body.insertAdjacentHTML("beforeend", modalHtml);
    document.getElementById("loginEmailBtn")?.addEventListener("click", () => { const email = document.getElementById("loginEmail").value; if(email) loginUser(email, "user"); document.getElementById("authModal")?.remove(); });
    document.getElementById("registerBtn")?.addEventListener("click", () => { const email = document.getElementById("loginEmail").value; if(email) loginUser(email, "user"); document.getElementById("authModal")?.remove(); });
    document.getElementById("demoAdminBtn")?.addEventListener("click", () => { loginUser("admin@meon.com", "admin"); document.getElementById("authModal")?.remove(); });
    document.getElementById("demoDevBtn")?.addEventListener("click", () => { loginUser("dev@meon.com", "developer"); document.getElementById("authModal")?.remove(); });
    document.getElementById("closeModal")?.addEventListener("click", () => document.getElementById("authModal")?.remove());
  }
  const themeToggle = document.getElementById("themeToggle");
  themeToggle?.addEventListener("click",()=>{ document.documentElement.classList.toggle("dark"); localStorage.setItem("meonTheme", document.documentElement.classList.contains("dark") ? "dark" : "light"); lucide.createIcons(); });
  if(localStorage.getItem("meonTheme") === "dark") document.documentElement.classList.add("dark");
  document.getElementById("mpesaConfirmBtn")?.addEventListener("click", confirmMpesaPayment);
  document.getElementById("mpesaCancelBtn")?.addEventListener("click", () => { document.getElementById("mpesaModal").classList.add("hidden"); currentPaymentApp = null; });
  renderNav();
  renderCurrentView();
  window.toggleFavorite = toggleFavorite;
  window.downloadApp = downloadApp;
</script>
</body>
</html>
