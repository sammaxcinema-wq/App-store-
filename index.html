        // ============================================================

        (function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                console.log('[PWA] Service workers not supported');
                return;
            }

            const CACHE_NAME = 'meon-directory-v11';
            const urlsToCache = [
                location.href.split('?')[0],
                'https://cdn.tailwindcss.com',
                'https://unpkg.com/lucide@latest',
                'https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap',
                'https://i.ibb.co/VY0yR03N/file-00000000503c724692cbd3d68fec0056.png'
            ];

            const swCode = `
                const CACHE_NAME = '${CACHE_NAME}';
                const urlsToCache = ${JSON.stringify(urlsToCache)};

                self.addEventListener('install', (event) => {
                    console.log('[SW] Installing...');
                    event.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => {
                            console.log('[SW] Caching app shell');
                            return cache.addAll(urlsToCache).catch((err) => {
                                console.warn('[SW] Some assets failed to cache:', err);
                            });
                        }).then(() => {
                            return self.skipWaiting();
                        })
                    );
                });

                self.addEventListener('activate', (event) => {
                    console.log('[SW] Activating...');
                    event.waitUntil(
                        caches.keys().then((cacheNames) => {
                            return Promise.all(
                                cacheNames.map((cache) => {
                                    if (cache !== CACHE_NAME) {
                                        console.log('[SW] Deleting old cache:', cache);
                                        return caches.delete(cache);
                                    }
                                })
                            );
                        }).then(() => {
                            return self.clients.claim();
                        })
                    );
                });

                self.addEventListener('fetch', (event) => {
                    if (event.request.method !== 'GET') return;
                    if (event.request.url.startsWith('chrome-extension://')) return;

                    event.respondWith(
                        fetch(event.request)
                            .then((networkResponse) => {
                                if (networkResponse && networkResponse.status === 200) {
                                    const responseClone = networkResponse.clone();
                                    caches.open(CACHE_NAME).then((cache) => {
                                        try { cache.put(event.request, responseClone); } catch (e) {}
                                    });
                                }
                                return networkResponse;
                            })
                            .catch(() => {
                                return caches.match(event.request).then((cachedResponse) => {
                                    if (cachedResponse) return cachedResponse;
                                    if (event.request.mode === 'navigate') {
                                        return caches.match(urlsToCache[0]);
                                    }
                                    return new Response('Offline – resource not cached', {
                                        status: 503,
                                        statusText: 'Service Unavailable'
                                    });
                                });
                            })
                    );
                });

                self.addEventListener('push', (event) => {
                    const options = {
                        body: event.data ? event.data.text() : 'New update from Meon Directory',
                        icon: 'https://i.ibb.co/VY0yR03N/file-00000000503c724692cbd3d68fec0056.png',
                        badge: 'https://i.ibb.co/VY0yR03N/file-00000000503c724692cbd3d68fec0056.png',
                        vibrate: [200, 100, 200],
                        data: { url: self.location.origin }
                    };
                    event.waitUntil(
                        self.registration.showNotification('Meon Directory', options)
                    );
                });

                self.addEventListener('notificationclick', (event) => {
                    event.notification.close();
                    event.waitUntil(
                        clients.openWindow(event.notification.data.url || self.location.origin)
                    );
                });
            `;

            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            navigator.serviceWorker.register(swUrl, { scope: '/' })
                .then((registration) => {
                    console.log('[PWA] Service Worker registered with scope:', registration.scope);
                    window._pwaSwRegistration = registration;
                    window._pwaSwUrl = swUrl;
                })
                .catch((err) => {
                    console.warn('[PWA] Service Worker registration failed:', err);
                });
        })();

        class MpesaClient {
            constructor() {
                this.accessToken = null;
                this.tokenExpiry = null;
                this.retryCount = 0;
                this.maxRetries = 3;
            }

            async getAccessToken() {
                if (this.accessToken && this.tokenExpiry > Date.now()) {
                    return this.accessToken;
                }

                try {
                    const response = await fetch(
                        `${CONFIG.MPESA.BASE_URL}/oauth/v1/generate?grant_type=client_credentials`,
                        {
                            method: 'GET',
                            headers: {
                                'Authorization': `Basic ${btoa(`${CONFIG.MPESA.CONSUMER_KEY}:${CONFIG.MPESA.CONSUMER_SECRET}`)}`,
                            }
                        }
                    );

                    const data = await response.json();
                    
                    if (data.access_token) {
                        this.accessToken = data.access_token;
                        this.tokenExpiry = Date.now() + (data.expires_in || 3600) * 1000 - 60000;
                        this.retryCount = 0;
                        return this.accessToken;
                    } else {
                        throw new Error('Failed to get access token');
                    }
                } catch (error) {
                    console.error('M-Pesa Token Error:', error);
                    if (this.retryCount < this.maxRetries) {
                        this.retryCount++;
                        await new Promise(resolve => setTimeout(resolve, 2000 * this.retryCount));
                        return this.getAccessToken();
                    }
                    return 'demo_token';
                }
            }

            async stkPush(phoneNumber, amount, accountReference) {
                try {
                    const token = await this.getAccessToken();
                    
                    if (token === 'demo_token') {
                        return this.simulateStkPush(phoneNumber, amount, accountReference);
                    }
                    
                    const timestamp = this.getTimestamp();
                    const password = this.generatePassword(timestamp);

                    const payload = {
                        BusinessShortCode: CONFIG.MPESA.SHORTCODE,
                        Password: password,
                        Timestamp: timestamp,
                        TransactionType: 'CustomerPayBillOnline',
                        Amount: Math.round(amount),
                        PartyA: this.formatPhoneNumber(phoneNumber),
                        PartyB: CONFIG.MPESA.SHORTCODE,
                        PhoneNumber: this.formatPhoneNumber(phoneNumber),
                        CallBackURL: CONFIG.MPESA.CALLBACK_URL,
                        AccountReference: accountReference || `MEON-${Date.now()}`,
                        TransactionDesc: CONFIG.MPESA.TRANSACTION_DESC
                    };

                    const response = await fetch(
                        `${CONFIG.MPESA.BASE_URL}/mpesa/stkpush/v1/processrequest`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(payload),
                        }
                    );

                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('STK Push Error:', error);
                    return this.simulateStkPush(phoneNumber, amount, accountReference);
                }
            }

            async queryStatus(checkoutRequestId) {
                try {
                    const token = await this.getAccessToken();
                    
                    if (token === 'demo_token') {
                        return this.simulateQueryStatus(checkoutRequestId);
                    }
                    
                    const timestamp = this.getTimestamp();
                    const password = this.generatePassword(timestamp);

                    const payload = {
                        BusinessShortCode: CONFIG.MPESA.SHORTCODE,
                        Password: password,
                        Timestamp: timestamp,
                        CheckoutRequestID: checkoutRequestId,
                    };

                    const response = await fetch(
                        `${CONFIG.MPESA.BASE_URL}/mpesa/stkpushquery/v1/query`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(payload),
                        }
                    );

                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('STK Query Error:', error);
                    return this.simulateQueryStatus(checkoutRequestId);
                }
            }

            simulateStkPush(phoneNumber, amount, accountReference) {
                const checkoutId = 'ws_CO_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                return {
                    MerchantRequestID: 'MERCHANT-' + Date.now(),
                    CheckoutRequestID: checkoutId,
                    ResponseCode: '0',
                    ResponseDescription: 'Success. Request accepted for processing',
                    CustomerMessage: 'Success. Request accepted for processing'
                };
            }

            simulateQueryStatus(checkoutRequestId) {
                const isSuccess = Math.random() > 0.3;
                return {
                    ResultCode: isSuccess ? '0' : '1032',
                    ResultDesc: isSuccess ? 'The service request is processed successfully.' : 'Request cancelled by user',
                    MPesaReceiptNumber: isSuccess ? 'SFD' + Date.now().toString().slice(-8) : undefined
                };
            }

            getTimestamp() {
                const date = new Date();
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                return `${year}${month}${day}${hours}${minutes}${seconds}`;
            }

            generatePassword(timestamp) {
                const str = `${CONFIG.MPESA.SHORTCODE}${CONFIG.MPESA.PASSKEY}${timestamp}`;
                return btoa(str);
            }

            formatPhoneNumber(phone) {
                let cleaned = phone.replace(/[^0-9]/g, '');
                if (cleaned.startsWith('0')) {
                    cleaned = '254' + cleaned.substring(1);
                } else if (cleaned.startsWith('7')) {
                    cleaned = '254' + cleaned;
                } else if (!cleaned.startsWith('254')) {
                    cleaned = '254' + cleaned;
                }
                return cleaned;
            }

            validatePhoneNumber(phone) {
                const formatted = this.formatPhoneNumber(phone);
                return /^254[0-9]{9}$/.test(formatted);
            }
        }

        // ============================================================
        
        class PaymentHandler {
            constructor() {
                this.mpesa = new MpesaClient();
                this.isProcessing = false;
            }

            async initiatePayment(plan, phoneNumber) {
                if (this.isProcessing) {
                    showToast('⏳ Payment already in progress', 'info');
                    return;
                }

                const plans = {
                    free: { amount: 0, name: 'Free', trialDays: 0 },
                    standard: { amount: 500, name: 'Standard', trialDays: 14 },
                    featured: { amount: 1500, name: 'Featured', trialDays: 7 }
                };

                const planData = plans[plan];
                if (!planData) {
                    showToast('Invalid plan selected', 'error');
                    return;
                }

                if (plan === 'free') {
                    this.activateFreePlan();
                    return;
                }

                if (!this.mpesa.validatePhoneNumber(phoneNumber)) {
                    showToast('Please enter a valid phone number (e.g., 0712345678)', 'error');
                    return;
                }

                if (planData.trialDays > 0) {
                    const useTrial = confirm(`🎁 Start ${planData.trialDays}-day free trial for ${planData.name} plan?`);
                    if (useTrial) {
                        this.startTrial(plan, planData.trialDays);
                        return;
                    }
                }

                this.isProcessing = true;
                const formattedPhone = this.mpesa.formatPhoneNumber(phoneNumber);
                const accountReference = `MEON-${plan.toUpperCase()}-${Date.now().toString().slice(-6)}`;

                try {
                    this.updateProgress(10, '📱 Sending STK Push...');
                    
                    const response = await this.mpesa.stkPush(
                        formattedPhone,
                        planData.amount,
                        accountReference
                    );

                    if (response.ResponseCode === '0' || response.CheckoutRequestID) {
                        const checkoutId = response.CheckoutRequestID || 'DEMO-' + Date.now();
                        
                        const transaction = {
                            id: checkoutId,
                            plan: plan,
                            amount: planData.amount,
                            phoneNumber: formattedPhone,
                            accountReference,
                            status: 'pending',
                            createdAt: new Date().toISOString()
                        };

                        mpesaTransactions[checkoutId] = transaction;
                        saveState();

                        showToast('📱 STK Push sent! Check your phone and enter PIN.', 'info');
                        this.pollStatus(checkoutId, plan, planData);
                    } else {
                        showToast(`❌ Payment failed: ${response.ResponseDescription || 'Unknown error'}`, 'error');
                    }
                } catch (error) {
                    console.error('Payment error:', error);
                    showToast('❌ Payment failed. Please try again.', 'error');
                } finally {
                    this.isProcessing = false;
                }
            }

            async pollStatus(checkoutRequestId, plan, planData, maxAttempts = 20) {
                let attempts = 0;
                let interval = 3000;

                const poll = async () => {
                    if (attempts >= maxAttempts) {
                        const transaction = mpesaTransactions[checkoutRequestId];
                        if (transaction && transaction.status === 'pending') {
                            transaction.status = 'timeout';
                            saveState();
                            showToast('⏰ Payment timed out. Please try again.', 'error');
                            this.updateProgress(100, '');
                        }
                        return;
                    }

                    attempts++;
                    this.updateProgress(30 + (attempts / maxAttempts) * 60, `⏳ Waiting for confirmation... (${attempts}/${maxAttempts})`);
                    await new Promise(resolve => setTimeout(resolve, interval));

                    try {
                        const status = await this.mpesa.queryStatus(checkoutRequestId);
                        const transaction = mpesaTransactions[checkoutRequestId];

                        if (status.ResultCode === '0') {
                            transaction.status = 'completed';
                            transaction.completedAt = new Date().toISOString();
                            transaction.mpesaReceipt = status.MPesaReceiptNumber || 'RECEIPT-' + Date.now();
                            saveState();
                            
                            this.activatePlan(plan);
                            showToast(`✅ Payment successful! Receipt: ${transaction.mpesaReceipt}`, 'success');
                            this.updateProgress(100, '✅ Payment complete!');
                            renderCurrentView();
                            return;
                        } else if (status.ResultCode === '1032') {
                            transaction.status = 'cancelled';
                            saveState();
                            showToast('❌ Payment cancelled by user', 'error');
                            this.updateProgress(100, '');
                            return;
                        } else if (status.ResultCode && status.ResultCode !== '200001') {
                            transaction.status = 'failed';
                            transaction.error = status.ResultDesc || 'Unknown error';
                            saveState();
                            showToast(`❌ Payment failed: ${transaction.error}`, 'error');
                            this.updateProgress(100, '');
                            return;
                        }

                        poll();
                    } catch (error) {
                        console.error('Polling error:', error);
                        poll();
                    }
                };

                poll();
            }

            activatePlan(plan) {
                if (currentUser) {
                    currentUser.subscription = {
                        plan: plan,
                        activatedAt: new Date().toISOString(),
                        expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString()
                    };
                    saveState();
                }
                showToast(`🎉 ${plan.charAt(0).toUpperCase() + plan.slice(1)} plan activated!`, 'success');
            }

            startTrial(plan, trialDays) {
                if (currentUser) {
                    currentUser.subscription = {
                        plan: plan,
                        trial: true,
                        trialDays: trialDays,
                        activatedAt: new Date().toISOString(),
                        trialEndsAt: new Date(Date.now() + trialDays * 24 * 60 * 60 * 1000).toISOString()
                    };
                    saveState();
                }
                showToast(`🎁 ${trialDays}-day free trial started for ${plan.charAt(0).toUpperCase() + plan.slice(1)} plan!`, 'success');
            }

            activateFreePlan() {
                this.activatePlan('free');
            }

            updateProgress(percentage, text) {
                const progress = document.getElementById('paymentProgress');
                const fill = document.getElementById('progressFill');
                const textEl = document.getElementById('progressText');
                
                if (progress) progress.classList.add('active');
                if (fill) fill.style.width = percentage + '%';
                if (textEl) textEl.textContent = text || '⏳ Processing...';
                if (percentage >= 100) {
                    setTimeout(() => {
                        if (progress) progress.classList.remove('active');
                        if (fill) fill.style.width = '0%';
                    }, 2000);
                }
            }

            resetProgress() {
                const progress = document.getElementById('paymentProgress');
                const fill = document.getElementById('progressFill');
                if (progress) progress.classList.remove('active');
                if (fill) fill.style.width = '0%';
            }
        }

        // PAYMENT UI FUNCTIONS
        // ============================================================
        
        function openPaymentModal(plan) {
            const plans = {
                free: { name: 'Free', price: 'KES 0', icon: '💎', trial: '' },
                standard: { name: 'Standard', price: 'KES 500', icon: '⭐', trial: '14-day free trial' },
                featured: { name: 'Featured', price: 'KES 1,500', icon: '🏆', trial: '7-day free trial' }
            };

            const planData = plans[plan];
            if (!planData) return;

            currentPlan = plan;

            document.getElementById('modalIcon').textContent = planData.icon;
            document.getElementById('modalTitle').textContent = `${planData.name} Plan`;
            document.getElementById('modalSubtitle').textContent = planData.trial || 'Complete your subscription payment';
            document.getElementById('modalPrice').innerHTML = `${planData.price} <small>/mo</small>`;
            document.getElementById('phoneInput').value = '';
            
            const handler = new PaymentHandler();
            handler.resetProgress();

            if (plan === 'free') {
                document.getElementById('modalSubtitle').textContent = 'Activate your free plan';
                document.getElementById('confirmPayment').textContent = '🚀 Activate Free Plan';
                document.getElementById('phoneGroup').style.display = 'none';
            } else {
                document.getElementById('confirmPayment').textContent = '💳 Pay with M-Pesa';
                document.getElementById('phoneGroup').style.display = 'block';
            }

            document.getElementById('confirmPayment').disabled = false;
            document.getElementById('paymentModal').classList.add('active');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
            const handler = new PaymentHandler();
            handler.resetProgress();
            currentPlan = null;
        }

        async function processPayment() {
            const plan = currentPlan;
            if (!plan) return;

            if (plan === 'free') {
                const handler = new PaymentHandler();
                handler.activateFreePlan();
                closePaymentModal();
                renderCurrentView();
                return;
            }

            const phoneInput = document.getElementById('phoneInput');
            const phone = phoneInput.value.trim();

            if (!phone) {
                showToast('Please enter your M-Pesa phone number', 'error');
                phoneInput.focus();
                return;
            }

            const handler = new PaymentHandler();
            document.getElementById('confirmPayment').disabled = true;
            document.getElementById('confirmPayment').textContent = '⏳ Processing...';

            await handler.initiatePayment(plan, phone);

            setTimeout(() => {
                document.getElementById('confirmPayment').disabled = false;
                document.getElementById('confirmPayment').textContent = '💳 Pay with M-Pesa';
            }, 30000);
        }

                                <input type="email" id="loginEmail" placeholder="you@example.com" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            </div>
                            <div><label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                                <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="submit" id="loginBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition font-semibold">Sign In</button>
                                <button type="button" id="registerBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg transition font-semibold">Sign Up</button>
                            </div>
                        </form>
                        <div class="mt-4 space-y-2">
                            <button id="demoAdminBtn" class="w-full bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 py-2 rounded-lg transition text-sm">🔑 Demo Admin Access</button>
                            <button id="demoDevBtn" class="w-full bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 py-2 rounded-lg transition text-sm">👨‍💻 Demo Developer Access</button>

                        <button id="closeModal" class="w-full mt-4 text-gray-400 hover:text-gray-300 transition text-sm">Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML("beforeend", modalHtml);
            
            document.getElementById('authForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                if (email) { loginUser(email, 'user'); document.getElementById('authModal')?.remove(); }
            });
            document.getElementById('registerBtn')?.addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value;
                if (email) { loginUser(email, 'user'); document.getElementById('authModal')?.remove(); } else { showToast('Please enter an email address', 'error'); }
            });
            document.getElementById('demoAdminBtn')?.addEventListener('click', () => { loginUser('admin@meon.com', 'admin', 'Admin'); document.getElementById('authModal')?.remove(); });
            document.getElementById('demoDevBtn')?.addEventListener('click', () => { loginUser('dev@meon.com', 'developer', 'Developer'); document.getElementById('authModal')?.remove(); });
            document.getElementById('closeModal')?.addEventListener('click', () => { document.getElementById('authModal')?.remove(); });
        }

        function showSubmitAppModal() {
            if (!currentUser) { showToast('Please sign in first', 'error'); showAuthModal(); return; }
            
            const modalHtml = `
                <div id="submitAppModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                    <div class="bg-gray-900 rounded-2xl p-6 w-full max-w-3xl max-h-[90vh] overflow-y-auto">
                        <h2 class="text-2xl font-bold text-white mb-4">🚀 Submit Your App</h2>
                        <form id="submitAppForm" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">App Name *</label>
                                    <input type="text" id="appName" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                                </div>
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Category *</label>
                                    <select id="appCategory" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                                        <option value="">Select category</option>
                                        <option value="AI Tools">AI Tools</option>
                                        <option value="Productivity">Productivity</option>
                                        <option value="Business">Business</option>
                                        <option value="Education">Education</option>
                                        <option value="Health & Wellness">Health & Wellness</option>
                                        <option value="Finance">Finance</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Design">Design</option>
                                        <option value="Utilities">Utilities</option>
                                        <option value="Social">Social</option>
                                    </select>

                            <div><label class="block text-sm font-medium text-gray-300 mb-1">Short Description *</label>
                                <input type="text" id="appShortDesc" required placeholder="Brief description of your app" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                            </div>
                            <div><label class="block text-sm font-medium text-gray-300 mb-1">App URL *</label>
                                <input type="url" id="appUrl" required placeholder="https://your-app.vercel.app" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                            </div>
                            <div><label class="block text-sm font-medium text-gray-300 mb-1">Logo URL</label>
                                <input type="url" id="appLogo" placeholder="https://your-app.com/logo.png" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                            </div>
                            <div><label class="block text-sm font-medium text-gray-300 mb-1">Full Description</label>
                                <textarea id="appDescription" rows="3" placeholder="Detailed description of your app" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white"></textarea>
                            </div>
                            <div><label class="block text-sm font-medium text-gray-300 mb-1">Features (comma separated)</label>
                                <input type="text" id="appFeatures" placeholder="Feature 1, Feature 2, Feature 3" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
                            </div>
                            <div class="border-t border-gray-700 pt-4">
                                <h3 class="text-lg font-semibold text-white mb-3">💰 Set Your Pricing (KES)</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Free Tier Price</label>
                                        <input type="text" id="submitFreePrice" value="KES 0" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                    </div>
                                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Standard Price</label>
                                        <input type="text" id="submitStandardPrice" value="KES 500/mo" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                    </div>
                                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Featured Price</label>
                                        <input type="text" id="submitFeaturedPrice" value="KES 1,500/mo" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
                                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Standard Trial Days</label>
                                        <input type="number" id="submitStandardTrial" value="14" min="0" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                    </div>
                                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Featured Trial Days</label>
                                        <input type="number" id="submitFeaturedTrial" value="7" min="0" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-3 pt-4">
                                <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition font-semibold">Submit App</button>
                                <button type="button" onclick="document.getElementById('submitAppModal')?.remove()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg transition">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('submitAppForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const features = document.getElementById('appFeatures').value.split(',').map(f => f.trim()).filter(f => f);
                const appData = {
                    id: 'app-' + Date.now(),
                    name: document.getElementById('appName').value,
                    shortDesc: document.getElementById('appShortDesc').value,
                    category: document.getElementById('appCategory').value,
                    externalUrl: document.getElementById('appUrl').value,
                    logoUrl: document.getElementById('appLogo').value,
                    description: document.getElementById('appDescription').value,
                    features: features.length ? features : ['Feature 1', 'Feature 2', 'Feature 3'],
                    developer: currentUser.email,
                    ownerId: currentUser.id,
                    tier: 'FREE',
                    trialActive: false,
                    rating: 0,
                    ratingCount: 0,
                    version: '1.0.0',
                    screenshots: ['https://via.placeholder.com/400x250/1a1a2e/8b5cf6?text=' + document.getElementById('appName').value],
                    downloads: 0,
                    pricing: {
                        freePrice: document.getElementById('submitFreePrice').value,
                        standardPrice: document.getElementById('submitStandardPrice').value,
                        featuredPrice: document.getElementById('submitFeaturedPrice').value,
                        standardTrialDays: parseInt(document.getElementById('submitStandardTrial').value) || 14,
                        featuredTrialDays: parseInt(document.getElementById('submitFeaturedTrial').value) || 7,
                    }
                };
                appList.push(appData);
                customPricing[appData.id] = appData.pricing;
                saveState();
                showToast('✅ App submitted successfully!', 'success');
                document.getElementById('submitAppModal')?.remove();
                renderCurrentView();
            });
        }

        function editAppPricing(appId) {
            const app = appList.find(a => a.id === appId);
            if (!app) return;
            const pricing = customPricing[appId] || {};
            
            const modalHtml = `
                <div id="pricingModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                    <div class="bg-gray-900 rounded-2xl p-6 w-full max-w-2xl">
                        <h2 class="text-2xl font-bold text-white mb-4">💰 Custom Pricing - ${app.name}</h2>
                        <form id="pricingForm" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Free Tier Price</label>
                                    <input type="text" id="pricingFree" value="${pricing.freePrice || 'KES 0'}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                </div>
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Standard Tier Price</label>
                                    <input type="text" id="pricingStandard" value="${pricing.standardPrice || 'KES 500/mo'}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                </div>
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Featured Tier Price</label>
                                    <input type="text" id="pricingFeatured" value="${pricing.featuredPrice || 'KES 1,500/mo'}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Standard Trial Days</label>
                                    <input type="number" id="pricingStandardTrial" value="${pricing.standardTrialDays || 14}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                </div>
                                <div><label class="block text-sm font-medium text-gray-300 mb-1">Featured Trial Days</label>
                                    <input type="number" id="pricingFeaturedTrial" value="${pricing.featuredTrialDays || 7}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                                </div>
                            </div>
                            <div class="flex gap-3 pt-4">
                                <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition font-semibold">Save Pricing</button>
                                <button type="button" onclick="document.getElementById('pricingModal')?.remove()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg transition">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('pricingForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const pricingData = {
                    freePrice: document.getElementById('pricingFree').value,
                    standardPrice: document.getElementById('pricingStandard').value,
                    featuredPrice: document.getElementById('pricingFeatured').value,
                    standardTrialDays: parseInt(document.getElementById('pricingStandardTrial').value) || 0,
                    featuredTrialDays: parseInt(document.getElementById('pricingFeaturedTrial').value) || 0,
                };
                customPricing[appId] = pricingData;
                saveState();
                showToast('✅ Pricing updated successfully!', 'success');
                document.getElementById('pricingModal')?.remove();
                renderCurrentView();
            });
        }

        function viewAppAnalytics(appId) {
            const app = appList.find(a => a.id === appId);
            if (!app) return;
            showToast(`📊 ${app.name} - ${app.downloads.toLocaleString()} downloads, ${app.ratingCount} reviews`, 'info');
        }

        // ============================================================
        // UPGRADE HANDLER
        // ============================================================
        
        window.handleUpgrade = function(appId, tierKey) {
            if (!currentUser) {
                showToast('Please sign in to upgrade', 'error');
                showAuthModal();
                return;
            }

            const app = appList.find(a => a.id === appId);
            if (!app) {
                showToast('App not found', 'error');
                return;
            }

            const tier = DEFAULT_TIERS[tierKey];
            if (app.tier === tierKey && !app.trialActive) {
                showToast(`Already on ${tier.name} tier`, 'info');
                return;
            }

            openPaymentModal(tierKey.toLowerCase());
        };

        // ============================================================
        // MAIN RENDER FUNCTION
        // ============================================================
        
        function renderCurrentView() {
            const container = document.getElementById("mainContent");
            if (!container) return;
            
            if (selectedApp) {
                container.innerHTML = renderAppDetail();
            } else if (activeView === "home") {
                container.innerHTML = renderHome();
                setTimeout(() => {
                    const searchInput = document.getElementById("globalSearchInput");
                    if (searchInput) {
                        searchInput.addEventListener("input", (e) => { searchQuery = e.target.value; renderCurrentView(); });
                    }
                    document.querySelectorAll(".category-chip").forEach(c => c.addEventListener("click", () => {
                        activeCategoryFilter = c.dataset.category; renderCurrentView();
                    }));
                    document.getElementById("clearCategoryBtn")?.addEventListener("click", () => { activeCategoryFilter = ""; renderCurrentView(); });
                    document.getElementById("exploreMarketplaceBtn")?.addEventListener("click", () => {
                        document.querySelector(".grid.sm\\:grid-cols-2")?.scrollIntoView({ behavior: "smooth" });
                    });
                    document.getElementById("becomeDevBtn")?.addEventListener("click", () => { 
                        if (!currentUser) showToast("Please login first", "error");
                        else { navigateTo('developer'); }
                    });
                }, 50);
            } else if (activeView === "dashboard") {
                container.innerHTML = renderDashboard();
            } else if (activeView === "pricing") {
                container.innerHTML = renderPricingPage();
            } else if (activeView === "att") {
                container.innerHTML = renderATT();
            } else if (activeView === "admin") {
                container.innerHTML = renderAdmin();
            } else if (activeView === "developer") {
                container.innerHTML = renderDeveloper();
            } else if (activeView === "terms") {
                container.innerHTML = renderTerms();
                document.getElementById('acceptTermsBtn')?.addEventListener('click', () => {
                    termsAccepted = true;
                    localStorage.setItem('meonTermsAccepted', 'true');
                    showToast('✅ Terms accepted!', 'success');
                    navigateTo('home');
                });
            } else if (activeView === "about") {
                container.innerHTML = renderAbout();
            }
            
            if (window.lucide) lucide.createIcons();
            
            if (selectedApp && document.getElementById("reviewStars")) {
                let ratingVal = 0;
                const starDiv = document.getElementById("reviewStars");
                starDiv.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    let star = document.createElement('i');
                    star.setAttribute('data-lucide', 'star');
                    star.className = 'w-6 h-6 cursor-pointer rating-star';
                    star.onclick = () => { ratingVal = i; document.querySelectorAll('#reviewStars i').forEach((s, idx) => { s.style.fill = idx < i ? '#facc15' : 'none'; }); };
                    starDiv.appendChild(star);
                }
                lucide.createIcons();
                document.getElementById("submitReviewBtn")?.addEventListener("click", () => {
                    const txt = document.getElementById("reviewText").value;
                    if (ratingVal && txt) submitReview(selectedApp.id, ratingVal, txt);
                    else showToast("Please provide rating and comment", "error");
                });
            }
        }

        // ============================================================
        // NAVIGATION SETUP
        // ============================================================
        
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const view = btn.getAttribute("data-nav");
                if (view) navigateTo(view);
            });
        });

        function renderNav() {
            const authDiv = document.getElementById("authSection");
            if (!authDiv) return;
            
            if (currentUser) {
                authDiv.innerHTML = `
                    <span class="text-sm hidden sm:inline text-gray-700 dark:text-gray-300">👤 ${currentUser.name}</span>
                    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition">Logout</button>
                `;
                document.getElementById("logoutBtn")?.addEventListener("click", logout);
                document.getElementById("adminNavBtn")?.classList.toggle("hidden", currentUser.role !== 'admin' && currentUser.role !== 'super_admin');
                document.getElementById("devNavBtn")?.classList.toggle("hidden", currentUser.role !== 'developer');
            } else {
                authDiv.innerHTML = `
                    <button id="showLoginModalBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-lg text-sm transition">Sign In</button>
                `;
                document.getElementById("showLoginModalBtn")?.addEventListener("click", showAuthModal);
                document.getElementById("adminNavBtn")?.classList.add("hidden");
                document.getElementById("devNavBtn")?.classList.add("hidden");
            }
            if (window.lucide) lucide.createIcons();
        }

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        
        const themeToggle = document.getElementById("themeToggle");
        themeToggle?.addEventListener("click", () => {
            document.documentElement.classList.toggle("dark");
            localStorage.setItem("meonTheme", document.documentElement.classList.contains("dark") ? "dark" : "light");
            if (window.lucide) lucide.createIcons();
        });
        
        if (localStorage.getItem("meonTheme") === "dark") document.documentElement.classList.add("dark");

        // ============================================================
        // GLOBAL EXPOSURES
        // ============================================================
        
        window.showAppDetail = (appId) => { selectedApp = appList.find(a => a.id === appId); renderCurrentView(); };
        window.backToHome = () => { selectedApp = null; navigateTo('home'); };
        window.openApp = openApp;
        window.toggleFavorite = toggleFavorite;
        window.handleUpgrade = window.handleUpgrade;
        window.showSubmitAppModal = showSubmitAppModal;
        window.editAppPricing = editAppPricing;
        window.viewAppAnalytics = viewAppAnalytics;
        window.showAuthModal = showAuthModal;
        window.navigateTo = navigateTo;
        window.openPaymentModal = openPaymentModal;
        window.closePaymentModal = closePaymentModal;
        window.processPayment = processPayment;

        // Modal event listeners
        document.getElementById('confirmPayment')?.addEventListener('click', processPayment);
        document.getElementById('cancelPayment')?.addEventListener('click', closePaymentModal);
        document.getElementById('paymentModal')?.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closePaymentModal();
        });
        document.getElementById('phoneInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processPayment();
        });
        document.getElementById('phoneInput')?.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value.length > 10) value = value.slice(0, 10);
            e.target.value = value;
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        
        // Check if terms are accepted, if not, navigate to terms page
        if (!termsAccepted && activeView !== 'terms') {
            navigateTo('terms');
        }
        
        renderNav();
        renderCurrentView();
        updateOnlineStatus();
        
        console.log('🚀 Meon App Directory v11.0 - Enterprise Edition with Terms, About, WhatsApp');
        console.log('📱 M-Pesa Sandbox: Active');
        console.log('💳 Plans: Free, Standard (KES 500/mo), Featured (KES 1,500/mo)');
        console.log('👤 User:', currentUser?.email || 'Not logged in');
        console.log('🔐 Demo Admin: admin@meon.com');
        console.log('👨‍💻 Demo Developer: dev@meon.com');
        console.log('📞 Consultation: +254 758 639 923');
        console.log('📜 Terms & Conditions: Active');
        console.log('📋 Navigation order: Home → About Us → Terms → others');
        console.log('🖼️ Background image applied to all sections');
    </script>
</body>
</html>
